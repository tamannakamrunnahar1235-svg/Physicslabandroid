
name: Build Physics Lab APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p extracted_project
          unzip PhysicsLab_Android_Prototype_Project.zip -d extracted_project
          test -f extracted_project/PhysicsLabAndroid/settings.gradle

      - name: Build debug APK
        run: gradle -p extracted_project/PhysicsLabAndroid assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsLab-debug-apk
          path: extracted_project/PhysicsLabAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
