name: Build APK from Source ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Extract the source code from the ZIP file
      - name: Extract Project ZIP
        run: |
          mkdir -p extracted_project
          unzip PhysicsLab_Android_Prototype_Project.zip -d extracted_project
          
      # 3. Set up Java Development Kit (JDK)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Make Gradle wrapper executable & Build APK (for native Android)
      - name: Build Android APK
        run: |
          cd extracted_project
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 5. Save the generated APK as a downloadable Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
